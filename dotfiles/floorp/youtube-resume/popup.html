<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
	:root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #0000001a; --hover: #0000000d; --accent: #e53935; }
	@media (prefers-color-scheme: dark) {
		:root { --bg: #1c1b22; --fg: #f2f2f4; --muted: #a0a0aa; --line: #ffffff1a; --hover: #ffffff12; }
	}
	body { margin: 0; width: 360px; max-height: 560px; overflow-y: auto; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
	header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 6px; }
	h2 { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
	button { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 2px 4px; border-radius: 6px; }
	button:hover { background: var(--hover); }
	ul { list-style: none; margin: 0; padding: 0 6px 8px; }
	li { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
	li:hover { background: var(--hover); }
	.text { flex: 1; min-width: 0; }
	.title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.meta { color: var(--muted); font-size: 11px; margin-top: 3px; display: flex; align-items: center; gap: 8px; }
	.bar { flex: 1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
	.bar > div { height: 100%; background: var(--accent); }
	.forget { color: var(--muted); font-weight: 400; visibility: hidden; }
	li:hover .forget { visibility: visible; }
	.empty { color: var(--muted); padding: 4px 14px 14px; }
	section + section { border-top: 1px solid var(--line); }
</style>
</head>
<body>
	<section id="session" hidden>
		<header><h2>Open when the browser closed</h2><button id="openAll">Open all</button></header>
		<ul id="sessionList"></ul>
	</section>
	<section>
		<header><h2>Continue watching</h2></header>
		<ul id="recentList"></ul>
		<div class="empty" id="empty" hidden>Nothing yet – a video keeps its place once it has played a few seconds.</div>
	</section>
	<script src="popup.js"></script>
</body>
</html>
