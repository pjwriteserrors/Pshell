; /etc/gamemode.ini: the part gamemoded takes only from /etc.
;   sudo install -m644 dotfiles/gamemode/gamemode-system.ini /etc/gamemode.ini

[gpu]
apply_gpu_optimisations=accept-responsibility
; the RX 5700 (Navi 10)
gpu_device=0
; highest clocks while a game runs, auto again after
amd_performance_level=high
