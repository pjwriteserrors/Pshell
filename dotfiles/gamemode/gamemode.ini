; Feral GameMode for every game of the library (scripts/feral.py). gamemoded
; reads the GPU part only from /etc: gamemode-system.ini (the PC's RX 5700).

[general]
reaper_freq=5
; intel_pstate: performance also sets the energy preference to performance;
; leaving restores what was set before
desiredgov=performance
igpu_power_threshold=-1
; nice -10 and the best I/O priority (bfq); needs the gamemode group
; (/etc/security/limits.d/10-gamemode.conf allows -10)
renice=10
ioprio=0
; SCHED_ISO is not in the zen kernel
softrealtime=off
inhibit_screensaver=1
; split lock detection slows some Windows games down
disable_splitlock=1

[cpu]
; no X3D or hybrid cores here: nothing to park or pin
park_cores=no
pin_cores=no
