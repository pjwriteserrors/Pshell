<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · House Studies</title>
<style>
:root{color-scheme:light;--ink:#34483f;--muted:#738174;--paper:#ede9dd;--line:#d3d6c7;--green:#476b59}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px system-ui,sans-serif}header{padding:30px 40px 23px;border-bottom:1px solid var(--line);display:flex;gap:25px;justify-content:space-between;align-items:center}.eyebrow{font:11px system-ui;letter-spacing:2.2px;color:var(--muted);text-transform:uppercase}h1{font:36px Georgia,serif;font-weight:normal;margin:6px 0}header p{margin:0;color:var(--muted);line-height:1.6}.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.controls label{display:flex;align-items:center;gap:8px}button,select{border:1px solid #bfc9b8;background:#f5f2e9;border-radius:6px;color:var(--ink);padding:9px 12px;font:inherit;cursor:pointer}button:hover,button:focus-visible{background:#dfe7d9}input{accent-color:var(--green);width:110px}main{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}article{background:var(--paper);min-width:0;position:relative}canvas{display:block;width:100%;height:440px;touch-action:none;cursor:zoom-in;background:radial-gradient(ellipse 22% 6% at 50% 83%,#8b917b44,transparent 100%)}.caption{display:flex;justify-content:space-between;align-items:center;padding:0 30px 25px;gap:12px}.caption h2{font:25px Georgia,serif;font-weight:normal;margin:3px 0 6px}.caption p{color:var(--muted);margin:0;font-size:12px}.number{font-size:11px;letter-spacing:2px;color:var(--muted)}.variants{display:flex;gap:4px}.variants button[aria-pressed=true]{color:#f8f4e9;background:var(--green);border-color:var(--green)}footer{padding:18px 40px;display:flex;justify-content:space-between;gap:24px;line-height:1.6;color:var(--muted);font-size:12px}article.expanded{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column}article.expanded canvas{height:calc(100vh - 105px);flex:1}article.expanded .caption{padding-top:12px}.status{font-variant-numeric:tabular-nums}.error{padding:40px;color:#913f38}@media(max-width:800px){header{padding:22px;display:block}.controls{margin-top:16px}main{grid-template-columns:1fr}canvas{height:440px}footer{padding:20px;display:block}}
</style>
<header><div><div class="eyebrow">World / Asset Study 03</div><h1>Houses with History</h1><p>Four procedural fantasy houses · Isometric · Live animation</p></div><div class="controls"><label>Light <input id="light" type="range" min="0" max="1" value="0.15" step="0.01" aria-label="Day to night"></label><button id="pause">Pause animation</button><button id="reset">Reset view</button></div></header>
<main id="sheet"></main>
<footer><span>Click a house: detail view · Scroll: zoom · Escape: return to sheet</span><span>Python geometry rendered in WebGL. No image references or baked textures.</span></footer>
<script src="houses.js"></script>
<script>
'use strict';
(async()=>{
const packed=Uint8Array.from(atob(window.HOUSE_DATA),c=>c.charCodeAt(0));
const samples=await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
const state={paused:matchMedia('(prefers-reduced-motion: reduce)').matches,time:0,last:0,night:.15};
const views=[];
const vertex=`attribute vec3 aPosition;attribute vec3 aColor;attribute float aEmission;uniform vec2 uResolution;uniform float uZoom;varying vec3 vColor;varying vec3 vWorld;varying float vEmission;void main(){vec2 p=vec2(aPosition.x-aPosition.y,(aPosition.x+aPosition.y)*.5-aPosition.z);gl_Position=vec4(p.x*uZoom/(uResolution.x*.5),-p.y*uZoom/(uResolution.y*.5)-.40,-(aPosition.x+aPosition.y+aPosition.z)/120.,1.);vColor=aColor;vWorld=aPosition;vEmission=aEmission;}`;
const fragment=`#extension GL_OES_standard_derivatives : enable
precision mediump float;varying vec3 vColor;varying vec3 vWorld;varying float vEmission;uniform float uNight;uniform float uTime;void main(){vec3 n=normalize(cross(dFdx(vWorld),dFdy(vWorld)));if(dot(n,vec3(1.))<0.)n=-n;float light=.72+.30*max(0.,dot(n,normalize(vec3(-.4,.7,1.2))));vec3 c=vColor*light;c*=mix(vec3(1.),vec3(.36,.47,.64),uNight);c+=vColor*vEmission*uNight*2.;gl_FragColor=vec4(c,1.);}`;
const pv=`attribute vec3 aPosition;attribute float aSize;attribute vec4 aColor;uniform vec2 uResolution;uniform float uZoom;varying vec4 vColor;void main(){vec2 p=vec2(aPosition.x-aPosition.y,(aPosition.x+aPosition.y)*.5-aPosition.z);gl_Position=vec4(p.x*uZoom/(uResolution.x*.5),-p.y*uZoom/(uResolution.y*.5)-.40,-(aPosition.x+aPosition.y+aPosition.z)/120.,1.);gl_PointSize=aSize*uZoom;vColor=aColor;}`;
const pf=`precision mediump float;varying vec4 vColor;void main(){float r=length(gl_PointCoord-.5)*2.;float alpha=(1.-smoothstep(.2,1.,r))*vColor.a;gl_FragColor=vec4(vColor.rgb,alpha);}`;
function program(gl,v,f){const p=gl.createProgram();for(const [type,code]of [[gl.VERTEX_SHADER,v],[gl.FRAGMENT_SHADER,f]]){const s=gl.createShader(type);gl.shaderSource(s,code);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));gl.attachShader(p,s)}gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(p));return p}
function uniforms(gl,p,w,h,zoom){gl.uniform2f(gl.getUniformLocation(p,'uResolution'),w,h);gl.uniform1f(gl.getUniformLocation(p,'uZoom'),zoom)}
function attribute(gl,p,name,n,stride,offset){const a=gl.getAttribLocation(p,name);if(a>=0){gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,n,gl.FLOAT,false,stride,offset)}}
function view(sample,index){const article=document.createElement('article');article.innerHTML=`<canvas aria-label="${sample.name}: animated isometric geometry"></canvas><div class="caption"><div><div class="number">0${index+1}</div><h2>${sample.name}</h2><p>${sample.subtitle}</p></div><div class="variants" aria-label="House variants"><button aria-pressed="true">I</button><button aria-pressed="false">II</button><button aria-pressed="false">III</button></div></div>`;document.querySelector('#sheet').append(article);const canvas=article.querySelector('canvas');const gl=canvas.getContext('webgl',{alpha:true,antialias:true,preserveDrawingBuffer:true});if(!gl||!gl.getExtension('OES_standard_derivatives'))throw Error('This preview requires WebGL with standard derivatives.');
const p=program(gl,vertex,fragment),particles=program(gl,pv,pf),buffer=gl.createBuffer(),fx=gl.createBuffer(),flags=gl.createBuffer();let variant=0,zoom=1,count=0;
function load(n){variant=n;gl.bindBuffer(gl.ARRAY_BUFFER,buffer);const data=new Float32Array(sample.variants[n].vertices);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);count=data.length/7;article.querySelectorAll('.variants button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n)))}load(0);
article.querySelectorAll('.variants button').forEach((b,i)=>b.onclick=e=>{e.stopPropagation();load(i)});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.65,Math.min(3.5,zoom*Math.exp(-e.deltaY*.001)))},{passive:false});
canvas.onclick=()=>{const next=!article.classList.contains('expanded');document.querySelectorAll('.expanded').forEach(a=>a.classList.remove('expanded'));article.classList.toggle('expanded',next);zoom=1};
const item={article,reset(){zoom=1;article.classList.remove('expanded')},render(){const rect=canvas.getBoundingClientRect();if(rect.bottom<0||rect.top>innerHeight)return;const dpr=Math.min(devicePixelRatio||1,2);const w=Math.round(rect.width*dpr),h=Math.round(rect.height*dpr);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}const scale=Math.min(w/33,h/39)*zoom;
gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.depthMask(true);gl.disable(gl.BLEND);gl.useProgram(p);uniforms(gl,p,w,h,scale);gl.uniform1f(gl.getUniformLocation(p,'uNight'),state.night);gl.uniform1f(gl.getUniformLocation(p,'uTime'),state.time);gl.bindBuffer(gl.ARRAY_BUFFER,buffer);attribute(gl,p,'aPosition',3,28,0);attribute(gl,p,'aColor',3,28,12);attribute(gl,p,'aEmission',1,28,24);gl.drawArrays(gl.TRIANGLES,0,count);
// Cloth is new geometry every frame, anchored to the building's flag sockets.
const asset=sample.variants[variant],cloth=[];for(const [x,y,z]of asset.flags){for(let i=0;i<10;i++){const a=i/10,b=(i+1)/10;const pos=(t,down)=>[x+t*2.2,y+Math.sin(t*4-state.time*2.5)*.22*t,z-down*(1-.35*t)];const pts=[pos(a,0),pos(b,0),pos(b,1),pos(a,0),pos(b,1),pos(a,1)];for(const pt of pts)cloth.push(...pt,.56,.26,.30,0)}}if(cloth.length){gl.bindBuffer(gl.ARRAY_BUFFER,flags);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(cloth),gl.DYNAMIC_DRAW);attribute(gl,p,'aPosition',3,28,0);attribute(gl,p,'aColor',3,28,12);attribute(gl,p,'aEmission',1,28,24);gl.drawArrays(gl.TRIANGLES,0,cloth.length/7)}
// Depth-tested smoke and warm glass light; no sprite atlas or image loading.
const dots=[];for(const [x,y,z]of asset.smoke){for(let i=0;i<9;i++){const age=(state.time*.16+i/9)%1;dots.push(x+Math.sin(age*4+index)*age*1.2,y-age*.9,z+age*5,.65+age*1.7,.79,.79,.73,(1-age)*.23)}}for(let i=0;i<asset.lights.length;i++){const [x,y,z,r]=asset.lights[i];const flicker=.9+.1*Math.sin(state.time*2.4+i*1.7);dots.push(x,y+.10,z,r*3,1.,.69,.29,(.035+state.night*.27)*flicker)}
gl.useProgram(particles);uniforms(gl,particles,w,h,scale);gl.bindBuffer(gl.ARRAY_BUFFER,fx);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(dots),gl.DYNAMIC_DRAW);attribute(gl,particles,'aPosition',3,32,0);attribute(gl,particles,'aSize',1,32,12);attribute(gl,particles,'aColor',4,32,16);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);gl.drawArrays(gl.POINTS,0,dots.length/8);gl.depthMask(true);
}};views.push(item)}
try{samples.forEach(view);document.body.dataset.ready='true'}catch(error){document.body.dataset.error=error.message;document.querySelector('#sheet').innerHTML='<p class="error">'+error.message+'</p>';console.error(error)}
const pause=document.querySelector('#pause');function setPause(){pause.textContent=state.paused?'Resume animation':'Pause animation';pause.setAttribute('aria-pressed',state.paused)}setPause();pause.onclick=()=>{state.paused=!state.paused;setPause()};document.querySelector('#light').oninput=e=>state.night=Number(e.target.value);document.querySelector('#reset').onclick=()=>views.forEach(v=>v.reset());document.addEventListener('keydown',e=>{if(e.key==='Escape')views.forEach(v=>v.reset())});
let previousPaint=0;function frame(now){if(!state.last)state.last=now;if(!state.paused&&!document.hidden)state.time+=Math.min(.1,(now-state.last)/1000);state.last=now;if(now-previousPaint>32){for(const v of views)v.render();previousPaint=now}requestAnimationFrame(frame)}requestAnimationFrame(frame);
window.study={state,views,samples};
})().catch(error=>{document.body.dataset.error=error.message;document.querySelector('#sheet').textContent=error.message;console.error(error)});
</script>
</html>
