# docker compose -p pshell-nas -f server/docker-compose.yml up -d --build   (from ~/pshell-nas; deploy.sh does it)
name: pshell-nas

services:
  pshell-nas:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: pshell-nas:latest
    container_name: pshell-nas
    network_mode: host
    privileged: true            # SMART of the USB SSD, the SoC's sensors, wake-on-LAN broadcasts
    restart: unless-stopped
    # the Pi also runs Pi-hole (the home's DNS), wg-easy and Home Assistant: the NAS
    # may never take their memory. Its kernel boots with cgroup_disable=memory, so
    # mem_limit only counts once cgroup_enable=memory is in cmdline.txt; until then
    # each process's heap is capped (ulimit data: a MemoryError, not a dead Pi) and
    # the kernel ends the NAS first when memory runs out anyway.
    mem_limit: 2g
    memswap_limit: 2g
    oom_score_adj: 1000
    ulimits:
      data: 2147483648
    environment:
      MALLOC_ARENA_MAX: "2"     # threads decoding pictures otherwise keep their own heaps
      NAS_AREAS: "/=/storage/filerise/uploads;/Obsidian=/storage/obsidian-vault"
      NAS_PORT: "8096"
      TZ: Europe/Berlin
    volumes:
      - /mnt/storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - ../server/pshell_nas:/app/pshell_nas:ro
      - ../files:/app/files:ro
      - ../host.py:/app/host.py:ro
      - ../web:/app/web:ro

  ollama:
    image: ollama/ollama:0.40.15
    container_name: pshell-nas-ollama
    profiles: ["ai"]            # deploy.sh adds it while the setting pi_ai is on
    network_mode: host          # 127.0.0.1:11434, for the NAS only
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: "1"
    cpus: 2
    mem_limit: 1536m
    memswap_limit: 1536m
    oom_score_adj: 1000
    volumes:
      - /mnt/storage/pshell-nas/ollama:/root/.ollama
